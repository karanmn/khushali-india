<html lang="en">
<head>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: #1e293b;
      --card-bg: #334155;
      --card-hover: #475569;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.35);
      --hq-color: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Header */
    .header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .brand span {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: block;
    }

    .stats-bar {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
    }

    .stat-pill {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .stat-pill strong {
      color: var(--accent);
      font-size: 0.95rem;
      margin-right: 4px;
    }

    .btn-toggle {
      background: var(--accent);
      color: #06281e;
      border: none;
      padding: 7px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-toggle:hover {
      opacity: 0.9;
    }

    /* Main Layout */
    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar Panel */
    .sidebar {
      width: 390px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 500;
    }

    .filters {
      padding: 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-input, .state-select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-dark);
      color: var(--text-main);
      font-size: 0.88rem;
      outline: none;
    }

    .search-input:focus, .state-select:focus {
      border-color: var(--accent);
    }

    .entries-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .entry-card {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 13px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .entry-card:hover, .entry-card.active {
      border-color: var(--accent);
      background: rgba(16, 185, 129, 0.08);
      transform: translateY(-1px);
    }

    .entry-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 4px;
    }

    .firm-name {
      font-weight: 600;
      font-size: 0.92rem;
      color: var(--text-main);
    }

    .state-tag {
      font-size: 0.7rem;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
      font-weight: 600;
    }

    .customer-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .entry-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.76rem;
      color: #cbd5e1;
    }

    .transport-badge {
      background: #334155;
      color: #e2e8f0;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.7rem;
    }

    /* Map Container */
    #map {
      flex: 1;
      height: 100%;
      background: #0b1120;
    }

    /* Custom Marker Styles */
    .delivery-pin {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #ffffff;
      box-shadow: 0 0 10px var(--accent);
    }

    .hq-pin {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--hq-color);
      border: 3px solid #ffffff;
      box-shadow: 0 0 16px var(--hq-color);
    }

    .leaflet-popup-content-wrapper {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 10px;
    }

    .leaflet-popup-tip {
      background: #1e293b;
    }
    /* OpenStreetMap को डार्क मोड में बदलने की निंजा टेक्निक */
.leaflet-layer,
.leaflet-control-zoom-in,
.leaflet-control-zoom-out,
.leaflet-control-attribution {
  filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
}


    @media (max-width: 768px) {
      .main-container {
        flex-direction: column-reverse;
      }
      .sidebar {
        width: 100%;
        height: 46%;
      }
      #map {
        height: 54%;
      }
    }
  </style>
</head>

    // Initialize Map centered on India
    const map = L.map("map", {
      center: [23.8, 80.0],
      zoom: 5,
      minZoom: 4
    });

// 100% Free OpenStreetMap Basemap (No API Key Required)
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(map);


    // Layer Groups
    const markersLayer = L.layerGroup().addTo(map);
    const linesLayer = L.layerGroup().addTo(map);
    let showLines = true;
    const markerMap = {};

    // Add Jaipur HQ Pin
    const hqIcon = L.divIcon({
      className: "",
      html: '<div class="hq-pin"></div>',
      iconSize: [20, 20],
      iconAnchor: [10, 10]
    });

    L.marker([JAIPUR_HQ.lat, JAIPUR_HQ.lng], { icon: hqIcon })
      .addTo(map)
      .bindPopup("<b>Khushali Chemicals HQ</b><br/>Galta Gate, Jaipur, Rajasthan");

    // Populate State Filter Dropdown
    const states = [...new Set(deliveries.map(d => d.state))].sort();
    document.getElementById("stateCount").textContent = states.length;
    const stateSelect = document.getElementById("stateSelect");
    states.forEach(st => {
      const count = deliveries.filter(d => d.state === st).length;
      const opt = document.createElement("option");
      opt.value = st;
      opt.textContent = `${st} (${count})`;
      stateSelect.appendChild(opt);
    });

    // Render Markers and Sidebar Cards
    function renderData(list) {
      markersLayer.clearLayers();
      linesLayer.clearLayers();
      const container = document.getElementById("entriesList");
      container.innerHTML = "";
      document.getElementById("totalCount").textContent = list.length;

      const pinIcon = L.divIcon({
        className: "",
        html: '<div class="delivery-pin"></div>',
        iconSize: [14, 14],
        iconAnchor: [7, 7]
      });

      list.forEach(item => {
        // Marker
        const marker = L.marker([item.lat, item.lng], { icon: pinIcon });
        const transportHtml = item.transport
          ? `<br/><span><b>Transport:</b> ${item.transport}</span>`
          : "";

        marker.bindPopup(
          `<div style="min-width:180px;">
            <div style="font-weight:700;color:#10b981;font-size:0.95rem;margin-bottom:3px;">${item.firm}</div>
            <div style="font-size:0.8rem;color:#cbd5e1;"><b>Customer:</b> ${item.customer}</div>
            <div style="font-size:0.8rem;color:#cbd5e1;"><b>Location:</b> ${item.rawLocation}</div>
            <div style="font-size:0.8rem;color:#cbd5e1;"><b>State:</b> ${item.state}${transportHtml}</div>
          </div>`
        );
        markersLayer.addLayer(marker);
        markerMap[item.id] = marker;

        // Supply Line from Jaipur HQ
        if (showLines) {
          const line = L.polyline(
            [
              [JAIPUR_HQ.lat, JAIPUR_HQ.lng],
              [item.lat, item.lng]
            ],
            {
              color: "#10b981",
              weight: 1.2,
              opacity: 0.35,
              dashArray: "4, 6"
            }
          );
          linesLayer.addLayer(line);
        }

        // Sidebar Card
        const card = document.createElement("div");
        card.className = "entry-card";
        card.id = `card-${item.id}`;
        card.innerHTML = `
          <div class="entry-top">
            <span class="firm-name">#${item.id} ${item.firm}</span>
            <span class="state-tag">${item.state}</span>
          </div>
          <div class="customer-sub">Customer: ${item.customer}</div>
          <div class="entry-meta">
            <span>📍 ${item.rawLocation}</span>
            ${item.transport ? `<span class="transport-badge">🚚 ${item.transport}</span>` : ""}
          </div>
        `;
        card.onclick = () => focusEntry(item);
        container.appendChild(card);
      });
    }

    function focusEntry(item) {
      document.querySelectorAll(".entry-card").forEach(c => c.classList.remove("active"));
      const activeCard = document.getElementById(`card-${item.id}`);
      if (activeCard) activeCard.classList.add("active");

      map.flyTo([item.lat, item.lng], 9, { duration: 1.1 });
      const marker = markerMap[item.id];
      if (marker) marker.openPopup();
    }

    function filterEntries() {
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      const selectedState = document.getElementById("stateSelect").value;

      const filtered = deliveries.filter(item => {
        const matchesState = selectedState === "ALL" || item.state === selectedState;
        const matchesQuery =
          item.customer.toLowerCase().includes(q) ||
          item.firm.toLowerCase().includes(q) ||
          item.rawLocation.toLowerCase().includes(q) ||
          item.city.toLowerCase().includes(q) ||
          item.state.toLowerCase().includes(q) ||
          item.transport.toLowerCase().includes(q);
        return matchesState && matchesQuery;
      });

      renderData(filtered);
    }

    function toggleSupplyLines() {
      showLines = !showLines;
      document.getElementById("toggleLinesBtn").textContent = showLines
        ? "Hide Supply Lines"
        : "Show Supply Lines";
      filterEntries();
    }

    function resetMapView() {
      map.flyTo([23.8, 80.0], 5, { duration: 1 });
    }

    // Initial Render
    renderData(deliveries);
